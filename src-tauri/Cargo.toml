[package]
name = "deixa-desktop"
version = "0.0.5"
description = "Casca nativa do Deixa: bandeja, janela e atalhos para o servidor local"
authors = ["Matheus Caldeira <matheuscardozo4@gmail.com>"]
edition = "2021"
publish = false

[lib]
name = "deixa_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
tauri-plugin-notification = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
