<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abrir no celular</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        font-family: system-ui, sans-serif;
        background: #f2f2f8;
        color: #1d2430;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      #code {
        background: #fff;
        padding: 14px;
        border-radius: 16px;
        width: 240px;
        height: 240px;
      }
      #code svg {
        width: 100%;
        height: 100%;
      }
      #address {
        font-family: ui-monospace, monospace;
        font-size: 15px;
        user-select: all;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #5a6475;
        max-width: 280px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Abrir no celular</h1>
    <div id="code"></div>
    <div id="address"></div>
    <p>Aponte a câmera para o código. O celular precisa estar na mesma rede deste computador.</p>
    <script>
      const data = window.__DEIXA_QR__ || { svg: "", url: "" };
      document.getElementById("code").innerHTML = data.svg;
      document.getElementById("address").textContent = data.url;
    </script>
  </body>
</html>
