<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deixa · conversa revisada (POC)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
  />
  <style>
    /* Layout: coluna única de celular (máx. 480px), barra superior de status, conteúdo rolável, navegação inferior fixa; estudo em tela cheia. */
    :root {
      --bg: #f2f3f8;
      --surface: #ffffff;
      --surface-2: #e8eaf2;
      --ink: #161927;
      --muted: #5f6680;
      --line: #d8dbe6;
      --brand: #2f43d6;
      --brand-deep: #1e2c9e;
      --brand-soft: #e3e7ff;
      --cue: #ffc63a;
      --cue-deep: #c9930c;
      --cue-ink: #3a2900;
      --cue-soft: #fff3d1;
      --flame: #ff5a33;
      --good: #0f9e73;
      --good-soft: #ddf5ec;
      --bad: #dd3b44;
      --bad-soft: #fde3e4;
      --shadow: 0 1px 2px rgba(22, 25, 39, 0.06), 0 6px 18px rgba(22, 25, 39, 0.06);
      --f-display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
      --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --r: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1018;
        --surface: #171a26;
        --surface-2: #212536;
        --ink: #edeff7;
        --muted: #9aa1b9;
        --line: #2b3046;
        --brand: #6e80ff;
        --brand-deep: #4153d8;
        --brand-soft: #232a55;
        --cue: #ffc63a;
        --cue-deep: #b88608;
        --cue-ink: #2b1f00;
        --cue-soft: #3a2f12;
        --flame: #ff6a45;
        --good: #2cc594;
        --good-soft: #123a2f;
        --bad: #ff6b71;
        --bad-soft: #3f1b20;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1018;
      --surface: #171a26;
      --surface-2: #212536;
      --ink: #edeff7;
      --muted: #9aa1b9;
      --line: #2b3046;
      --brand: #6e80ff;
      --brand-deep: #4153d8;
      --brand-soft: #232a55;
      --cue: #ffc63a;
      --cue-deep: #b88608;
      --cue-ink: #2b1f00;
      --cue-soft: #3a2f12;
      --flame: #ff6a45;
      --good: #2cc594;
      --good-soft: #123a2f;
      --bad: #ff6b71;
      --bad-soft: #3f1b20;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    input,
    textarea,
    select {
      font: inherit;
      color: var(--ink);
    }
    :focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 2px;
      border-radius: 8px;
    }
    h1,
    h2,
    h3 {
      font-family: var(--f-display);
      margin: 0;
      text-wrap: balance;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
    }
    .mono {
      font-family: var(--f-mono);
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      position: relative;
      background: var(--bg);
    }
    .main {
      padding: 0 16px 112px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    /* top bar */
    .topbar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid transparent;
    }
    .topbar.scrolled {
      border-color: var(--line);
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      font-weight: 800;
      color: #fff;
      flex: none;
      font-size: 16px;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      font-size: 14px;
    }
    .stat svg {
      width: 18px;
      height: 18px;
    }
    .spacer {
      flex: 1;
    }
    .lvlchip {
      font-family: var(--f-mono);
      font-weight: 700;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--cue);
      color: var(--cue-ink);
    }
    /* bottom nav */
    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, 480px);
      z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    .nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .nav button svg {
      width: 24px;
      height: 24px;
    }
    .nav button.on {
      color: var(--brand);
      background: var(--brand-soft);
    }
    /* generic */
    .card {
      background: var(--surface);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .muted {
      color: var(--muted);
    }
    .small {
      font-size: 13px;
    }
    .sec-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .sec-h h2 {
      font-size: 20px;
    }
    .link {
      color: var(--brand);
      font-weight: 700;
      font-size: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.02em;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 4px 0 var(--brand-deep);
      transition:
        transform 0.08s,
        box-shadow 0.08s;
      text-transform: uppercase;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--brand-deep);
    }
    .btn.block {
      width: 100%;
    }
    .btn.cue {
      background: var(--cue);
      color: var(--cue-ink);
      box-shadow: 0 4px 0 var(--cue-deep);
    }
    .btn.good {
      background: var(--good);
      box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 70%, #000);
    }
    .btn.bad {
      background: var(--bad);
      box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 70%, #000);
    }
    .btn.ghost {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 4px 0 var(--line);
      border: 2px solid var(--line);
    }
    .btn[disabled] {
      background: var(--surface-2);
      color: var(--muted);
      box-shadow: 0 4px 0 var(--line);
      cursor: not-allowed;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip.good {
      background: var(--good-soft);
      color: var(--good);
    }
    .chip.warn {
      background: var(--cue-soft);
      color: var(--cue-deep);
    }
    .chip.bad {
      background: var(--bad-soft);
      color: var(--bad);
    }
    .chip.brand {
      background: var(--brand-soft);
      color: var(--brand);
    }
    .bar {
      height: 10px;
      border-radius: 99px;
      background: var(--surface-2);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--brand);
    }
    .bar.cue > i {
      background: var(--cue);
    }
    .bar.good > i {
      background: var(--good);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(92px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      background: var(--ink);
      color: var(--bg);
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      z-index: 90;
      transition: 0.25s;
      max-width: min(440px, calc(100% - 32px));
      text-align: center;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* home */
    .hero {
      background: var(--ink);
      color: var(--bg);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .hero .eyebrow {
      color: color-mix(in srgb, var(--bg) 65%, transparent);
    }
    .hero h1 {
      font-size: 26px;
      line-height: 1.1;
    }
    .subline {
      font-family: var(--f-mono);
      font-size: 13px;
      background: #000;
      color: var(--cue);
      padding: 6px 10px;
      border-radius: 6px;
      align-self: flex-start;
      max-width: 100%;
    }
    .goalrow {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
    }
    .ring {
      width: 72px;
      height: 72px;
      position: relative;
    }
    .ring svg {
      width: 72px;
      height: 72px;
      transform: rotate(-90deg);
    }
    .ring b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--f-display);
      font-size: 17px;
    }
    .missions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mission {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .mission .ic {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--cue-soft);
      color: var(--cue-deep);
    }
    .mission .ic svg {
      width: 20px;
      height: 20px;
    }
    .mission .bar {
      height: 8px;
      margin-top: 5px;
    }
    /* trail */
    .trail {
      position: relative;
      padding: 8px 0 4px;
    }
    .trail::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 6px;
      margin-left: -3px;
      background: repeating-linear-gradient(to bottom, var(--line) 0 10px, transparent 10px 18px);
      border-radius: 3px;
    }
    .tnode {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0;
      width: 50%;
    }
    .tnode.l {
      flex-direction: row-reverse;
      margin-right: auto;
      padding-right: 10px;
      text-align: right;
    }
    .tnode.r {
      margin-left: 50%;
      padding-left: 10px;
    }
    .tnode .dot {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--muted);
      box-shadow: 0 5px 0 var(--line);
      margin: 0 -32px;
      position: relative;
      z-index: 1;
      border: 4px solid var(--bg);
    }
    .tnode .dot svg {
      width: 26px;
      height: 26px;
    }
    .tnode.done .dot {
      background: var(--cue);
      color: var(--cue-ink);
      box-shadow: 0 5px 0 var(--cue-deep);
    }
    .tnode.cur .dot {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 5px 0 var(--brand-deep);
      animation: pulse 2s infinite;
    }
    .tnode.cur .dot::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid var(--brand);
      opacity: 0.35;
    }
    @keyframes pulse {
      50% {
        transform: scale(1.05);
      }
    }
    .tnode .lbl {
      min-width: 0;
      padding: 0 38px;
    }
    .tnode .tc {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .tnode .nm {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.25;
    }
    .startpop {
      position: absolute;
      top: -38px;
      white-space: nowrap;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 9px;
      letter-spacing: 0.04em;
      z-index: 2;
      left: 50%;
      transform: translateX(-50%);
    }
    .tnode.l .startpop {
      left: auto;
      right: -36px;
      transform: none;
    }
    .tnode.r .startpop {
      left: -36px;
      transform: none;
    }

    /* catalog */
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .search input {
      border: 0;
      background: none;
      outline: none;
      flex: 1;
      min-width: 0;
    }
    .search svg {
      width: 20px;
      height: 20px;
      color: var(--muted);
    }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -16px;
      padding: 2px 16px;
    }
    .chips::-webkit-scrollbar {
      display: none;
    }
    .fchip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid var(--line);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      background: var(--surface);
    }
    .fchip.on {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-soft);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .poster {
      border-radius: 14px;
      aspect-ratio: 2/3;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      text-align: left;
      max-width: 100%;
    }
    .poster .pt {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 21px;
      line-height: 1.02;
      letter-spacing: -0.02em;
    }
    .poster .pm {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .poster .strip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 44px;
      height: 3px;
      background: currentColor;
      opacity: 0.25;
    }
    .ptile {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .ptile .meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hscroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -16px;
      padding: 4px 16px 8px;
    }
    .hscroll::-webkit-scrollbar {
      display: none;
    }
    .cont {
      flex: none;
      width: 260px;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: center;
      text-align: left;
    }
    .cont .poster {
      aspect-ratio: 2/3;
      padding: 6px;
    }
    .cont .poster .pt {
      font-size: 11px;
    }
    /* detail */
    .dhead {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 14px;
      align-items: end;
    }
    .dhead .poster .pt {
      font-size: 16px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--muted);
      padding: 6px 0;
    }
    .back svg {
      width: 20px;
      height: 20px;
    }
    .ep {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .ep:last-child {
      border-bottom: 0;
    }
    .ep .num {
      font-family: var(--f-mono);
      font-weight: 700;
      color: var(--muted);
      font-size: 13px;
    }
    .ep .t {
      font-weight: 700;
      line-height: 1.25;
    }
    .ep .bar {
      height: 6px;
      margin-top: 6px;
    }
    .playbtn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 3px 0 var(--brand-deep);
    }
    .playbtn svg {
      width: 20px;
      height: 20px;
    }
    .playbtn[disabled] {
      background: var(--surface-2);
      color: var(--muted);
      box-shadow: 0 3px 0 var(--line);
    }
    .fab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border: 2px dashed var(--line);
      border-radius: 14px;
      font-weight: 700;
      color: var(--brand);
      justify-content: center;
    }
    .fab svg {
      width: 20px;
      height: 20px;
    }

    /* lesson */
    .lesson {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .lhead {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }
    .lhead .bar {
      flex: 1;
      height: 14px;
    }
    .lhead .bar > i {
      background: var(--good);
      transition: width 0.3s;
    }
    .iconbtn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--muted);
    }
    .iconbtn svg {
      width: 24px;
      height: 24px;
    }
    .lbody {
      flex: 1;
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .prompt {
      font-family: var(--f-display);
      font-size: 23px;
      font-weight: 800;
      line-height: 1.15;
    }
    .cuebox {
      background: #0b0c12;
      border-radius: 14px;
      padding: 18px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .cuebox .tcode {
      font-family: var(--f-mono);
      font-size: 11px;
      color: #8a90a8;
      align-self: stretch;
      display: flex;
      justify-content: space-between;
    }
    .cuebox .line {
      font-family: var(--f-body);
      font-weight: 700;
      font-size: 20px;
      color: var(--cue);
      text-align: center;
      text-shadow: 0 2px 0 #000;
      line-height: 1.3;
    }
    .cuebox .line.hide {
      color: transparent;
      text-shadow: none;
      background: repeating-linear-gradient(90deg, #2a2e40 0 14px, transparent 14px 20px);
      border-radius: 4px;
      min-width: 60%;
    }
    .speak {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brand);
      color: #fff;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 800;
      box-shadow: 0 4px 0 var(--brand-deep);
    }
    .speak svg {
      width: 22px;
      height: 22px;
    }
    .speak.big {
      padding: 22px 26px;
      border-radius: 20px;
    }
    .speak.big svg {
      width: 34px;
      height: 34px;
    }
    .speak.slow {
      background: var(--surface);
      color: var(--brand);
      box-shadow: 0 4px 0 var(--line);
      border: 2px solid var(--line);
    }
    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt {
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--surface);
      font-weight: 600;
      box-shadow: 0 3px 0 var(--line);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .opt .k {
      font-family: var(--f-mono);
      font-size: 12px;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted);
      flex: none;
    }
    .opt.sel {
      border-color: var(--brand);
      background: var(--brand-soft);
      box-shadow: 0 3px 0 var(--brand);
    }
    .opt.ok {
      border-color: var(--good);
      background: var(--good-soft);
      box-shadow: 0 3px 0 var(--good);
    }
    .opt.no {
      border-color: var(--bad);
      background: var(--bad-soft);
      box-shadow: 0 3px 0 var(--bad);
    }
    .answerline {
      min-height: 108px;
      border-bottom: 2px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      padding: 8px 0;
      background: repeating-linear-gradient(to bottom, transparent 0 50px, var(--line) 50px 52px);
    }
    .bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .tok {
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--surface);
      font-weight: 700;
      box-shadow: 0 3px 0 var(--line);
    }
    .tok.used {
      background: var(--surface-2);
      color: transparent;
      box-shadow: none;
    }
    .tok.in {
      border-color: var(--line);
    }
    textarea.ta {
      width: 100%;
      min-height: 120px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--surface);
      padding: 14px;
      resize: vertical;
      outline: none;
    }
    textarea.ta:focus {
      border-color: var(--brand);
    }
    .hint {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--cue-soft);
      color: var(--ink);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
    }
    .hint b {
      color: var(--cue-deep);
    }
    .intro {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .intro .en {
      font-family: var(--f-display);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
    }
    .intro .pt {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      font-size: 14px;
    }
    .kv dt {
      font-weight: 800;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: 2px;
    }
    .kv dd {
      margin: 0;
    }
    .lfoot {
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      border-top: 2px solid var(--line);
      background: var(--bg);
    }
    .lfoot.ok {
      background: var(--good-soft);
      border-color: transparent;
    }
    .lfoot.no {
      background: var(--bad-soft);
      border-color: transparent;
    }
    .fb {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .fb h3 {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lfoot.ok h3 {
      color: var(--good);
    }
    .lfoot.no h3 {
      color: var(--bad);
    }
    .fb h3 svg {
      width: 26px;
      height: 26px;
    }
    .done {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      text-align: center;
    }
    .done h1 {
      font-size: 32px;
    }
    .donestats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }
    .dstat {
      border-radius: 14px;
      border: 2px solid var(--line);
      overflow: hidden;
      background: var(--surface);
    }
    .dstat .h {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5px;
      color: #fff;
    }
    .dstat .v {
      font-family: var(--f-display);
      font-size: 22px;
      font-weight: 800;
      padding: 10px 4px;
      font-variant-numeric: tabular-nums;
    }
    .clap {
      width: 120px;
      height: 96px;
    }

    /* review */
    .flash {
      perspective: 1200px;
      min-height: 300px;
    }
    .flash .inner {
      position: relative;
      min-height: 300px;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }
    .flash.flip .inner {
      transform: rotateY(180deg);
    }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 2px solid var(--line);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .face.back {
      transform: rotateY(180deg);
    }
    .face .en {
      font-family: var(--f-display);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
    }
    .grades {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .grade {
      padding: 10px 4px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
      border: 2px solid var(--line);
      background: var(--surface);
      box-shadow: 0 3px 0 var(--line);
    }
    .grade small {
      font-family: var(--f-mono);
      font-weight: 500;
      font-size: 11px;
      color: var(--muted);
    }
    .grade.g1 {
      color: var(--bad);
    }
    .grade.g2 {
      color: var(--cue-deep);
    }
    .grade.g3 {
      color: var(--good);
    }
    .grade.g4 {
      color: var(--brand);
    }
    .dueitem {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .dueitem:last-child {
      border: 0;
    }

    /* chat */
    .scen {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 12px;
      align-items: center;
      text-align: left;
      width: 100%;
    }
    .scen .ic {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--brand-soft);
      color: var(--brand);
    }
    .scen .ic svg {
      width: 24px;
      height: 24px;
    }
    .chat {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .msgs {
      flex: 1;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 84%;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.4;
    }
    .msg.ai {
      background: var(--surface);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 6px;
      align-self: flex-start;
    }
    .msg.me {
      background: var(--brand);
      color: #fff;
      border-bottom-right-radius: 6px;
      align-self: flex-end;
    }
    .msg .pt {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .fix {
      align-self: flex-start;
      max-width: 90%;
      background: var(--cue-soft);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fix s {
      color: var(--bad);
    }
    .fix ins {
      color: var(--good);
      text-decoration: none;
      font-weight: 700;
    }
    .composer {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    .composer input {
      flex: 1;
      min-width: 0;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--surface);
      padding: 12px;
      outline: none;
    }
    .composer input:focus {
      border-color: var(--brand);
    }
    .suggest {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 8px;
      scrollbar-width: none;
    }
    .suggest button {
      flex: none;
      padding: 8px 12px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
    }

    /* progress */
    .ladder {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      align-items: end;
    }
    .rung {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .rung .b {
      width: 100%;
      border-radius: 8px 8px 4px 4px;
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
    }
    .rung.past .b {
      background: var(--cue);
    }
    .rung.now .b {
      background: var(--surface-2);
      outline: 3px solid var(--brand);
      outline-offset: -3px;
    }
    .rung.now .b i {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--brand);
    }
    .rung span {
      font-family: var(--f-mono);
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
    }
    .rung.now span {
      color: var(--brand);
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .tile {
      padding: 14px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .tile svg {
      width: 26px;
      height: 26px;
      flex: none;
    }
    .tile b {
      font-family: var(--f-display);
      font-size: 20px;
      display: block;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .tile small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .bars {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      height: 150px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(var(--line), var(--line)) 0 33%/100% 1px no-repeat,
        linear-gradient(var(--line), var(--line)) 0 66%/100% 1px no-repeat;
    }
    .bars div {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 4px;
    }
    .bars i {
      display: block;
      width: 100%;
      max-width: 30px;
      border-radius: 6px 6px 2px 2px;
      background: var(--brand-soft);
    }
    .bars div.today i {
      background: var(--brand);
    }
    .bars em {
      font-style: normal;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .barlbl {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 6px;
    }
    .heat {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .heat i {
      aspect-ratio: 1;
      border-radius: 5px;
      background: var(--surface-2);
      max-width: 100%;
    }
    .heat i.h1 {
      background: color-mix(in srgb, var(--flame) 30%, var(--surface-2));
    }
    .heat i.h2 {
      background: color-mix(in srgb, var(--flame) 60%, var(--surface-2));
    }
    .heat i.h3 {
      background: var(--flame);
    }
    .heat i.today {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }
    .skill {
      display: grid;
      grid-template-columns: 110px 1fr 40px;
      gap: 10px;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }
    .skill b {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }
    .achs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .ach {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      padding: 12px 6px;
      border-radius: 14px;
      background: var(--surface);
      border: 2px solid var(--line);
    }
    .ach .medal {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--cue);
      color: var(--cue-ink);
      transform: rotate(-4deg);
    }
    .ach .medal svg {
      width: 26px;
      height: 26px;
    }
    .ach.locked .medal {
      background: var(--surface-2);
      color: var(--muted);
      transform: none;
    }
    .ach b {
      font-size: 12px;
      line-height: 1.2;
    }
    .ach small {
      font-size: 11px;
      color: var(--muted);
    }

    /* sheet */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 20, 0.5);
      z-index: 60;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet {
      background: var(--bg);
      width: min(100%, 480px);
      max-height: 92vh;
      overflow: auto;
      border-radius: 22px 22px 0 0;
      padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: up 0.25s ease-out;
    }
    @keyframes up {
      from {
        transform: translateY(40px);
        opacity: 0.5;
      }
    }
    .grab {
      width: 44px;
      height: 5px;
      border-radius: 9px;
      background: var(--line);
      margin: 0 auto 4px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-weight: 700;
      font-size: 13px;
    }
    .field input,
    .field select {
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--surface);
      padding: 12px;
      outline: none;
      width: 100%;
    }
    .field input:focus,
    .field select:focus {
      border-color: var(--brand);
    }
    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 12px;
    }
    .seg button {
      padding: 9px 4px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
    }
    .seg button.on {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .pstep {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }
    .pstep .s {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
    }
    .pstep .s svg {
      width: 14px;
      height: 14px;
    }
    .pstep.done .s {
      background: var(--good);
      border-color: var(--good);
      color: #fff;
    }
    .pstep.run .s {
      border-color: var(--brand);
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }
    .pstep.wait {
      color: var(--muted);
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .result {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--surface);
      text-align: left;
      width: 100%;
    }
    .result.on {
      border-color: var(--brand);
      background: var(--brand-soft);
    }
    .result .poster {
      aspect-ratio: 2/3;
      padding: 3px;
      border-radius: 6px;
    }
    .result .poster .pt {
      font-size: 7px;
    }
    /* picker */
    .picker {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .logo span {
      background: #000;
      color: var(--cue);
      padding: 0 8px;
      border-radius: 8px;
      margin-left: 2px;
    }
    .pcard {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border-radius: 18px;
      background: var(--surface);
      border: 2px solid var(--line);
      box-shadow: 0 4px 0 var(--line);
      text-align: left;
      width: 100%;
    }
    .pcard .avatar {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 22px;
    }
    .note {
      font-size: 12px;
      color: var(--muted);
      border-left: 3px solid var(--cue);
      padding-left: 10px;
    }
    /* leitura do episódio inteiro */
    .tx {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .txhead {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .txlines {
      flex: 1;
      padding: 4px 16px 24px;
      display: flex;
      flex-direction: column;
    }
    .scene {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 6px;
      font-family: var(--f-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .scene::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .tline {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 6px 8px;
      padding: 10px 10px;
      margin: 0 -10px;
      border-radius: 12px;
    }
    .tline.mk {
      background: var(--cue-soft);
    }
    .tline .tc {
      grid-column: 1/-1;
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tline .en {
      grid-column: 1;
      grid-row: 2;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.55;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .tline .pt,
    .tline .reveal {
      grid-column: 1;
      grid-row: 3;
    }
    .abtn {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      color: var(--brand);
      font-weight: 700;
      font-size: 11px;
      font-family: var(--f-mono);
    }
    .abtn .spin {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--brand);
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }
    .w {
      border-radius: 4px;
      padding: 1px 1px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .w.mk {
      background: linear-gradient(transparent 12%, var(--cue) 12%, var(--cue) 88%, transparent 88%);
      color: var(--cue-ink);
      padding: 1px 3px;
      margin: 0 -2px;
    }
    .w.hit {
      text-decoration: underline 2px var(--brand);
      text-underline-offset: 3px;
    }
    .tline .pt {
      grid-column: 1;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }
    .tline .pt .src {
      font-family: var(--f-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--surface-2);
      margin-right: 6px;

            nw = isNewEp(eid) && !S.epAdded;
          return `<div class="dest"><span class="ic ${nw ? "new" : ""}">${nw ? I.spark : I.film}</span><div class="col" style="gap:2px;min-width:0"><b>${esc(e.t)}</b><span class="small muted">T${s.n} · ${esc(ids.map((i) => DIFFS.find((d) => d.id === i).term).join(", "))}</span></div><span class="chip ${nw ? "warn" : "brand"}">${nw ? "Episódio novo" : "+" + ids.length}</span></div>`;
        })
        .join("");
      return `<div class="sec-h"><h2>Na sua série</h2></div>
    <p class="small muted" style="margin-top:-10px">A IA coloca cada card no episódio do assunto. Quando o assunto ainda não tem episódio, ela cria um.</p>
    <div class="card col" style="gap:12px">${rows || '<span class="muted small">Nenhum card marcado.</span>'}</div>`;
    }
    function applyReview() {
      if (S.epAdded) return;
      NEW_EPS.forEach(({ season, ep }) => SERIES.seasons.find((s) => s.id === season).eps.push(ep));
      [...S.sel].forEach((id) => {
        const e = findEp(DEST[id]);
        e.cards++;
        if (!e.fresh) e.plus = (e.plus || 0) + 1;
        if (!e.src.includes(THIS_CONVO)) e.src.unshift(THIS_CONVO);
      });
      SERIES.desc = SERIES.desc.replace(
        "as gírias das séries britânicas que você anda vendo",
        "as gírias e phrasal verbs das séries britânicas que você anda vendo (Ted Lasso entrou na conta)",
      );
      SERIES.descFrom = "5 conversas e 38 revisões";
      S.cardsMade = S.sel.size;
      S.epAdded = true;
    }
    function confirmCards() {
      const created = S.epAdded ? 0 : NEW_EPS.length;
      applyReview();
      toast(`${S.cardsMade} cards · ${created} episódios novos na série`);
      S.season = "s1";
      go("series");
    }

    function levelLabel() {
      const l = SERIES.level;
      return l.mode === "fixed" ? `Nível ${l.min}` : `Customizado · ${l.min}–${l.max}`;
    }
    function seriesScreen() {
      const season = SERIES.seasons.find((s) => s.id === (S.season || "s1"));
      const eps = allEps(),
        cards = eps.reduce((a, e) => a + e.cards, 0);
      const list = season.eps.length
        ? season.eps
            .map(
              (e) => `<div class="ep ${e.fresh ? "fresh" : ""}">
      <span class="num">E${e.n}</span>
      <div style="min-width:0"><div class="row" style="gap:6px;flex-wrap:wrap"><span class="t">${esc(e.t)}</span>${e.fresh ? '<span class="newbadge">NOVO</span>' : ""}${e.plus ? `<span class="chip brand">+${e.plus} ${e.plus === 1 ? "card" : "cards"}</span>` : ""}</div>
        <span class="small muted">${e.cards} ${e.cards === 1 ? "card" : "cards"} · ${e.src.length} ${e.src.length === 1 ? "conversa" : "conversas"}</span><div class="bar ${e.pct === 100 ? "good" : ""}"><i style="width:${progressOf(e)}%"></i></div></div>
      <button class="playbtn" onclick="openEp('${e.id}')" aria-label="Abrir">${I.play}</button></div>`,
            )
            .join("")
        : `<p class="small muted" style="padding:14px 0">Ainda vazia. A IA abre o primeiro episódio desta temporada quando suas conversas pedirem.</p>`;
      return `<div class="main" style="padding-top:12px">
    <button class="back" onclick="go('chat')">${I.back}Tutor</button>
    <div class="dhead"><div class="poster pposter"><span class="pm">Série pessoal</span><span class="pt"><span>Deixa ·</span>${esc(SERIES.name)}</span></div>
      <div class="col">
        <div class="row" style="gap:6px;align-items:flex-start"><h1 style="font-size:26px;line-height:1.05;flex:1;min-width:0;overflow-wrap:anywhere">${esc(SERIES.name)}</h1><button class="iconbtn" onclick="renameSheet()" aria-label="Renomear">${I.pen}</button></div>
        <span class="mono small muted">id: ${SERIES.id} · fixo</span>
        <div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip brand">${eps.length} episódios</span><span class="chip">${cards} cards</span><button class="chip warn" onclick="levelSheet()">${levelLabel()} ✎</button></div></div></div>
    <div class="descbox"><div class="row" style="gap:6px">${I.spark.replace("<svg", '<svg width="16" height="16" style="color:var(--brand)"')}<span class="eyebrow">Sobre esta série · escrita pela IA</span></div>
      <p>${esc(SERIES.desc)}</p><span class="small muted">Atualizada em ${SERIES.descAt} a partir de ${SERIES.descFrom}. Muda conforme você estuda.</span></div>
    <div class="seg">${SERIES.seasons.map((s) => `<button class="${s.id === season.id ? "on" : ""}" onclick="S.season='${s.id}';render()">${s.locked ? "🔒 " : ""}T${s.n} · ${s.level}</button>`).join("")}</div>
    <div class="sec-h"><h2>${esc(season.t)}</h2><span class="chip warn">${season.level}</span></div>
    ${season.locked ? lockedSeason(season) : `<div class="card" style="padding:4px 16px">${list}</div>`}
    <div class="fab" style="cursor:default">${I.spark}A IA cria o próximo episódio quando aparecer um assunto novo</div>
  </div>`;
    }
    function lockedSeason(s) {
      return `<div class="card col" style="gap:10px"><div class="row">${I.lock.replace("<svg", '<svg width="22" height="22" style="color:var(--muted);flex:none"')}<span class="small">Abre quando você passar de <b>${s.unlockAt}% do B1</b>. Hoje: ${s.levelPct}%.</span></div><div class="bar cue"><i style="width:${(s.levelPct / s.unlockAt) * 100}%"></i></div>
    <span class="eyebrow">Temas que devem voltar, mais avançados</span>${s.themes.map((t) => `<span class="small">· ${esc(t)}</span>`).join("")}
    <p class="note">Os temas da T1 voltam com foco no seu próximo nível. A IA escolhe pelos que mais apareceram nas suas conversas.</p></div>`;
    }
    function progressOf(e) {
      return e.fresh ? ((S.nodes[e.id] || 0) / TRAIL.length) * 100 : e.pct;
    }
    function renameSheet() {
      sheet(`<h2 style="font-size:20px">Nome da série</h2>
    <div class="field"><label for="sname">Como você quer chamar</label><input id="sname" maxlength="40" value="${esc(SERIES.name)}"></div>
    <p class="note">O id <span class="mono">${SERIES.id}</span> não muda. Cards, progresso e o pacote <span class="mono">.deixa.zip</span> continuam ligados a ele.</p>
    <button class="btn block" onclick="SERIES.name=document.getElementById('sname').value.trim()||SERIES.name;closeSheet();render()">Salvar</button>`);
      setTimeout(() => document.getElementById("sname")?.select(), 50);
    }
    function levelSheet() {
      const l = SERIES.level,
        opt = (sel, id) =>
          `<select id="${id}">${LEVELS.map((x) => `<option ${x === sel ? "selected" : ""}>${x}</option>`).join("")}</select>`;
      sheet(`<h2 style="font-size:20px">Nível da série</h2>
    <p class="small muted">Define o quanto a IA puxa nos episódios novos.</p>
    <div class="seg"><button class="${l.mode === "fixed" ? "on" : ""}" onclick="SERIES.level.mode='fixed';levelSheet()">Fixo</button><button class="${l.mode === "custom" ? "on" : ""}" onclick="SERIES.level.mode='custom';levelSheet()">Customizado</button></div>
    ${
      l.mode === "fixed"
        ? `<div class="field"><label>Nível</label>${opt(l.min, "lmin")}</div>`
        : `<div class="row"><div class="field" style="flex:1"><label>De</label>${opt(l.min, "lmin")}</div><div class="field" style="flex:1"><label>Até</label>${opt(l.max, "lmax")}</div></div><p class="note">Episódios de base ficam perto do mínimo; gírias e escuta podem ir até o máximo.</p>`
    }
    <button class="btn block" onclick="saveLevel()">Salvar</button>`);
    }
    function saveLevel() {
      const a = document.getElementById("lmin").value,
        b = document.getElementById("lmax")?.value;
      SERIES.level.min = a;
      if (b) SERIES.level.max = LEVELS.indexOf(b) < LEVELS.indexOf(a) ? a : b;
      closeSheet();
      render();
    }

    function openEp(id) {
      S.ep = id;
      go("episode");
    }
    function epDone(e) {
      return e.fresh ? S.nodes[e.id] || 0 : Math.round((e.pct / 100) * TRAIL.length);
    }
    function episodeScreen() {
      const e = findEp(S.ep),
        s = seasonOf(S.ep),
        done = epDone(e);
      const nodes = TRAIL.map((n, i) => {
        const st = i < done ? "done" : i === done ? "cur" : "locked";
        const side = i % 2 ? "r" : "l";
        return `<div class="tnode ${side} ${st}">${st === "cur" ? '<span class="startpop">COMEÇAR</span>' : ""}<button class="dot" ${st === "locked" ? "disabled" : ""} onclick="${st === "locked" ? "" : "startLesson()"}">${st === "done" ? I.check : st === "locked" ? I.lock : I[n.ic]}</button><div class="lbl"><div class="tc">Bloco ${i + 1}</div><div class="nm">${esc(n.nm)}</div></div></div>`;
      }).join("");
      const src = e.src
        .map(
          (x) =>
            `<div class="row" style="justify-content:space-between"><span class="small">${esc(x)}</span><button class="link small" onclick="${x === THIS_CONVO ? "go('chat')" : "toast('Abriria essa conversa encerrada')"}">Reler</button></div>`,
        )
        .join("");
      return `<div class="main" style="padding-top:12px">
    <button class="back" onclick="go('series')">${I.back}${esc(SERIES.name)}</button>
    <div class="col" style="gap:6px"><span class="eyebrow">Temporada ${s.n} · Episódio ${e.n}</span><h1 style="font-size:26px">${esc(e.t)}</h1>
      <div class="row" style="gap:6px;flex-wrap:wrap"><span class="chip brand">${e.cards} cards</span>${e.fresh ? '<span class="newbadge">NOVO</span>' : ""}<span class="chip">criado pela IA</span></div></div>
    <div class="card col" style="gap:8px"><span class="eyebrow">De onde vieram os cards</span>${src || '<span class="small muted">Nenhuma conversa ainda.</span>'}</div>
    <div class="trail">${nodes}</div>
  </div>`;
    }

    /* ============ LIÇÃO ============ */
    function startLesson() {
      S.les = { i: 0, pick: null, checked: false, built: [], hits: 0 };
      go("lesson");
    }
    function lessonScreen() {
      const L = S.les,
        ex = LESSON[L.i],
        pct = ((L.i + (L.checked ? 1 : 0)) / LESSON.length) * 100;
      let body = "";
      if (ex.kind === "blank") {
        body = `<div class="cuebox"><div class="tcode"><span>sua fala, corrigida</span><span>turno 2</span></div><div class="line">${esc(ex.line).replace("___", '<span style="border-bottom:3px solid var(--cue);padding:0 18px">' + (L.pick !== null ? esc(ex.opts[L.pick]) : "&nbsp;") + "</span>")}</div></div>
      <div class="opts">${ex.opts.map((o, i) => `<button class="opt ${cls(i)}" onclick="pick(${i})"><span class="k">${i + 1}</span>${esc(o)}</button>`).join("")}</div>`;
      } else if (ex.kind === "listen") {
        body = `<div class="row" style="justify-content:center;gap:14px"><button class="speak big" onclick="say('${ex.audio.replace(/'/g, "\\'")}')">${I.sound}</button><button class="speak slow" onclick="say('${ex.audio.replace(/'/g, "\\'")}',.6)">${I.turtle}</button></div>
      <div class="opts">${ex.opts.map((o, i) => `<button class="opt ${cls(i)}" onclick="pick(${i})"><span class="k">${i + 1}</span>${esc(o)}</button>`).join("")}</div>`;
      } else {
        body = `<div class="answerline">${L.built.map((t, i) => `<button class="tok in" onclick="unbuild(${i})">${esc(ex.tokens[t])}</button>`).join("")}</div>
      <div class="bank">${ex.tokens.map((t, i) => `<button class="tok ${L.built.includes(i) ? "used" : ""}" onclick="build(${i})">${esc(t)}</button>`).join("")}</div>`;
      }
      const ready = ex.kind === "order" ? L.built.length > 0 : L.pick !== null;
      const ok = L.checked && isRight();
      const foot = L.checked
        ? `<div class="lfoot ${ok ? "ok" : "no"}"><div class="fb"><h3>${ok ? I.check + "Isso!" : I.x + "Quase"}</h3><span class="small">${esc(ex.explain)}</span></div><button class="btn block ${ok ? "good" : "bad"}" onclick="nextEx()">Continuar</button></div>`
        : `<div class="lfoot"><button class="btn block" ${ready ? "" : "disabled"} onclick="check()">Verificar</button></div>`;
      return `<div class="lesson"><div class="lhead"><button class="iconbtn" onclick="go('episode')" aria-label="Sair">${I.x}</button><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="lbody"><p class="prompt">${esc(ex.prompt)}</p>${body}</div>${foot}</div>`;
    }
    function cls(i) {
      const L = S.les,
        ex = LESSON[L.i];
      if (!L.checked) return L.pick === i ? "sel" : "";
      if (i === ex.ok) return "ok";
      return L.pick === i ? "no" : "";
    }
    function pick(i) {
      if (S.les.checked) return;
      S.les.pick = i;
      render();
    }
    function build(i) {
      if (S.les.checked || S.les.built.includes(i)) return;
      S.les.built.push(i);
      render();
    }
    function unbuild(i) {
      if (S.les.checked) return;
      S.les.built.splice(i, 1);
      render();
    }
    function isRight() {
      const L = S.les,
        ex = LESSON[L.i];
      return ex.kind === "order"
        ? L.built.map((i) => ex.tokens[i]).join(" ") === ex.answer.join(" ")
        : L.pick === ex.ok;
    }
    function check() {
      S.les.checked = true;
      if (isRight()) S.les.hits++;
      render();
    }
    function nextEx() {
      const L = S.les;
      if (L.i < LESSON.length - 1) {
        L.i++;
        L.pick = null;
        L.checked = false;
        L.built = [];
        render();
      } else {
        {
          const e = findEp(S.ep);
          if (e.fresh) S.nodes[e.id] = Math.min((S.nodes[e.id] || 0) + 1, TRAIL.length);
          else e.pct = Math.min(100, e.pct + 20);
        }
        go("done");
      }
    }
    function doneScreen() {
      return `<div class="lesson"><div class="done"><div style="width:96px;height:96px;border-radius:28px;background:var(--cue);color:var(--cue-ink);display:grid;place-items:center;transform:rotate(-4deg)">${I.check.replace("<svg", '<svg width="48" height="48"')}</div>
    <h1>Bloco concluído!</h1><p class="muted">Seus erros da conversa viraram treino. Os cards entram na revisão de amanhã.</p>
    <div class="donestats"><div class="dstat"><div class="h" style="background:var(--cue-deep)">XP</div><div class="v">+12</div></div><div class="dstat"><div class="h" style="background:var(--good)">Acertos</div><div class="v">${S.les.hits}/${LESSON.length}</div></div><div class="dstat"><div class="h" style="background:var(--brand)">Cards</div><div class="v">${S.cardsMade}</div></div></div>
    <button class="btn block" onclick="go('episode')">Voltar à trilha</button></div></div>`;
    }

    /* ============ NAVEGAÇÃO DO POC ============ */
    function openDev() {
      const prep = () => {
        if (!S.closed) {
          S.closed = true;
        }
      };
      sheet(`<h2 style="font-size:20px">Telas do POC</h2><p class="small muted">Atalhos para cada etapa. Os dados são mocks; a IA não é chamada.</p>
    <div class="devlist">
      <button onclick="devGo('open')"><span>1</span>Conversa aberta (com correções)</button>
      <button onclick="devGo('confirm')"><span>2</span>Confirmar encerramento (com ou sem avaliação)</button>
      <button onclick="devGo('running')"><span>2b</span>Revisão rodando em segundo plano</button>
      <button onclick="devGo('noreview')"><span>2c</span>Encerrada sem avaliação</button>
      <button onclick="devGo('review')"><span>3</span>Revisão: dificuldades e cards</button>
      <button onclick="devGo('closed')"><span>4</span>Conversa só de leitura e escuta</button>
      <button onclick="devGo('series')"><span>5</span>Série pessoal</button>
      <button onclick="devGo('episode')"><span>6</span>Episódio com trilha</button>
      <button onclick="devGo('lesson')"><span>7</span>Lição gerada da conversa</button>
    </div>
    <button class="btn block ghost" onclick="toggleTheme()">Alternar tema claro/escuro</button>`);
    }
    function ensureAdded() {
      S.closed = true;
      S.review = "ready";
      applyReview();
    }
    function devGo(k) {
      if (k === "open") {
        S.closed = false;
        S.mode = "read";
        go("chat");
        return;
      }
      if (k === "confirm") {
        S.closed = false;
        go("chat");
        openConfirm();
        return;
      }
      if (k === "running") {
        S.closed = false;
        runClose();
        return;
      }
      if (k === "noreview") {
        S.closed = false;
        closeWithoutReview();
        return;
      }
      if (k === "review") {
        S.closed = true;
        S.review = "ready";
        go("review");
        return;
      }
      ensureAdded();
      if (k === "closed") {
        go("chat");
        return;
      }
      if (k === "lesson") {
        startLesson();
        return;
      }
      go(k);
    }
    function toggleTheme() {
      const r = document.documentElement;
      const dark = r.dataset.theme
        ? r.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      r.dataset.theme = dark ? "light" : "dark";
      closeSheet();
    }

    function render() {
      const v = {
        chat: chatScreen,
        review: reviewScreen,
        series: seriesScreen,
        episode: episodeScreen,
        lesson: lessonScreen,
        done: doneScreen,
      }[S.screen]();
      $("#app").innerHTML = v;
    }
    render();
  </script>
</html>
