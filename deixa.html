<title>Deixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: coluna única de celular (máx. 480px), barra superior de status, conteúdo rolável, navegação inferior fixa; estudo em tela cheia. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#E8EAF2; --ink:#161927; --muted:#5F6680; --line:#D8DBE6;
  --brand:#2F43D6; --brand-deep:#1E2C9E; --brand-soft:#E3E7FF;
  --cue:#FFC63A; --cue-deep:#C9930C; --cue-ink:#3A2900; --cue-soft:#FFF3D1;
  --flame:#FF5A33; --good:#0F9E73; --good-soft:#DDF5EC; --bad:#DD3B44; --bad-soft:#FDE3E4;
  --shadow:0 1px 2px rgba(22,25,39,.06),0 6px 18px rgba(22,25,39,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1018; --surface:#171A26; --surface-2:#212536; --ink:#EDEFF7; --muted:#9AA1B9; --line:#2B3046;
  --brand:#6E80FF; --brand-deep:#4153D8; --brand-soft:#232A55;
  --cue:#FFC63A; --cue-deep:#B88608; --cue-ink:#2B1F00; --cue-soft:#3A2F12;
  --flame:#FF6A45; --good:#2CC594; --good-soft:#123A2F; --bad:#FF6B71; --bad-soft:#3F1B20;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1018; --surface:#171A26; --surface-2:#212536; --ink:#EDEFF7; --muted:#9AA1B9; --line:#2B3046;
  --brand:#6E80FF; --brand-deep:#4153D8; --brand-soft:#232A55;
  --cue:#FFC63A; --cue-deep:#B88608; --cue-ink:#2B1F00; --cue-soft:#3A2F12;
  --flame:#FF6A45; --good:#2CC594; --good-soft:#123A2F; --bad:#FF6B71; --bad-soft:#3F1B20;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
.main{padding:0 16px 112px;display:flex;flex-direction:column;gap:18px}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid transparent}
.topbar.scrolled{border-color:var(--line)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;font-size:16px}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:14px}
.stat svg{width:18px;height:18px}
.spacer{flex:1}
.lvlchip{font-family:var(--f-mono);font-weight:700;font-size:12px;padding:5px 8px;border-radius:8px;background:var(--cue);color:var(--cue-ink)}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--brand);background:var(--brand-soft)}
/* generic */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:20px}
.link{color:var(--brand);font-weight:700;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.02em;padding:14px 18px;border-radius:14px;background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-deep);transition:transform .08s,box-shadow .08s;text-transform:uppercase}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.block{width:100%}
.btn.cue{background:var(--cue);color:var(--cue-ink);box-shadow:0 4px 0 var(--cue-deep)}
.btn.good{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--cue-soft);color:var(--cue-deep)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.cue>i{background:var(--cue)}
.bar.good>i{background:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;transition:.25s;max-width:min(440px,calc(100% - 32px));text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* home */
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.hero h1{font-size:26px;line-height:1.1}
.subline{font-family:var(--f-mono);font-size:13px;background:#000;color:var(--cue);padding:6px 10px;border-radius:6px;align-self:flex-start;max-width:100%}
.goalrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:72px;height:72px;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:17px}
.missions{display:flex;flex-direction:column;gap:12px}
.mission{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center}
.mission .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--cue-soft);color:var(--cue-deep)}
.mission .ic svg{width:20px;height:20px}
.mission .bar{height:8px;margin-top:5px}
/* trail */
.trail{position:relative;padding:8px 0 4px}
.trail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:repeating-linear-gradient(to bottom,var(--line) 0 10px,transparent 10px 18px);border-radius:3px}
.tnode{position:relative;display:flex;align-items:center;gap:12px;margin:10px 0;width:50%}
.tnode.l{flex-direction:row-reverse;margin-right:auto;padding-right:10px;text-align:right}
.tnode.r{margin-left:50%;padding-left:10px}
.tnode .dot{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);box-shadow:0 5px 0 var(--line);margin:0 -32px;position:relative;z-index:1;border:4px solid var(--bg)}
.tnode .dot svg{width:26px;height:26px}
.tnode.done .dot{background:var(--cue);color:var(--cue-ink);box-shadow:0 5px 0 var(--cue-deep)}
.tnode.cur .dot{background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand-deep);animation:pulse 2s infinite}
.tnode.cur .dot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--brand);opacity:.35}
@keyframes pulse{50%{transform:scale(1.05)}}
.tnode .lbl{min-width:0;padding:0 38px}
.tnode .tc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tnode .nm{font-weight:700;font-size:14px;line-height:1.25}
.startpop{position:absolute;top:-38px;white-space:nowrap;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:5px 10px;border-radius:9px;letter-spacing:.04em;z-index:2;left:50%;transform:translateX(-50%)}
.tnode.l .startpop{left:auto;right:-36px;transform:none}
.tnode.r .startpop{left:-36px;transform:none}

/* catalog */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.fchip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;background:var(--surface)}
.fchip.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.poster{border-radius:14px;aspect-ratio:2/3;padding:12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;text-align:left;max-width:100%}
.poster .pt{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.02;letter-spacing:-.02em}
.poster .pm{font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.poster .strip{position:absolute;left:0;right:0;bottom:44px;height:3px;background:currentColor;opacity:.25}
.ptile{display:flex;flex-direction:column;gap:6px;min-width:0}
.ptile .meta{display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px}
.hscroll::-webkit-scrollbar{display:none}
.cont{flex:none;width:260px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left}
.cont .poster{aspect-ratio:2/3;padding:6px}
.cont .poster .pt{font-size:11px}
/* detail */
.dhead{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:end}
.dhead .poster .pt{font-size:16px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);padding:6px 0}
.back svg{width:20px;height:20px}
.ep{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ep:last-child{border-bottom:0}
.ep .num{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-size:13px}
.ep .t{font-weight:700;line-height:1.25}
.ep .bar{height:6px;margin-top:6px}
.playbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-deep)}
.playbtn svg{width:20px;height:20px}
.playbtn[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:0 3px 0 var(--line)}
.fab{display:flex;align-items:center;gap:10px;padding:14px;border:2px dashed var(--line);border-radius:14px;font-weight:700;color:var(--brand);justify-content:center}
.fab svg{width:20px;height:20px}

/* lesson */
.lesson{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lhead .bar{flex:1;height:14px}
.lhead .bar>i{background:var(--good);transition:width .3s}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.iconbtn svg{width:24px;height:24px}
.lbody{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:18px}
.prompt{font-family:var(--f-display);font-size:23px;font-weight:800;line-height:1.15}
.cuebox{background:#0B0C12;border-radius:14px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.cuebox .tcode{font-family:var(--f-mono);font-size:11px;color:#8A90A8;align-self:stretch;display:flex;justify-content:space-between}
.cuebox .line{font-family:var(--f-body);font-weight:700;font-size:20px;color:var(--cue);text-align:center;text-shadow:0 2px 0 #000;line-height:1.3}
.cuebox .line.hide{color:transparent;text-shadow:none;background:repeating-linear-gradient(90deg,#2A2E40 0 14px,transparent 14px 20px);border-radius:4px;min-width:60%}
.speak{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;box-shadow:0 4px 0 var(--brand-deep)}
.speak svg{width:22px;height:22px}
.speak.big{padding:22px 26px;border-radius:20px}
.speak.big svg{width:34px;height:34px}
.speak.slow{background:var(--surface);color:var(--brand);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;box-shadow:0 3px 0 var(--line);display:flex;gap:12px;align-items:center}
.opt .k{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 0 var(--brand)}
.opt.ok{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.answerline{min-height:108px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;background:repeating-linear-gradient(to bottom,transparent 0 50px,var(--line) 50px 52px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;box-shadow:0 3px 0 var(--line)}
.tok.used{background:var(--surface-2);color:transparent;box-shadow:none}
.tok.in{border-color:var(--line)}
textarea.ta{width:100%;min-height:120px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:14px;resize:vertical;outline:none}
textarea.ta:focus{border-color:var(--brand)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--cue-soft);color:var(--ink);border-radius:12px;padding:12px;font-size:14px}
.hint b{color:var(--cue-deep)}
.intro{display:flex;flex-direction:column;gap:12px}
.intro .en{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.intro .pt{font-size:18px;font-weight:600;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{font-weight:800;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0}
.lfoot{padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg)}
.lfoot.ok{background:var(--good-soft);border-color:transparent}
.lfoot.no{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fb h3{font-size:20px;display:flex;align-items:center;gap:8px}
.lfoot.ok h3{color:var(--good)} .lfoot.no h3{color:var(--bad)}
.fb h3 svg{width:26px;height:26px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;text-align:center}
.done h1{font-size:32px}
.donestats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.dstat{border-radius:14px;border:2px solid var(--line);overflow:hidden;background:var(--surface)}
.dstat .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:5px;color:#fff}
.dstat .v{font-family:var(--f-display);font-size:22px;font-weight:800;padding:10px 4px;font-variant-numeric:tabular-nums}
.clap{width:120px;height:96px}

/* review */
.flash{perspective:1200px;min-height:300px}
.flash .inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}
.face.back{transform:rotateY(180deg)}
.face .en{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.15}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{padding:10px 4px;border-radius:12px;font-weight:800;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line)}
.grade small{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.grade.g1{color:var(--bad)} .grade.g2{color:var(--cue-deep)} .grade.g3{color:var(--good)} .grade.g4{color:var(--brand)}
.dueitem{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dueitem:last-child{border:0}

/* chat */
.scen{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.scen .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.scen .ic svg{width:24px;height:24px}
.chat{min-height:100%;display:flex;flex-direction:column}
.msgs{flex:1;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.4}
.msg.ai{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .pt{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.fix{align-self:flex-start;max-width:90%;background:var(--cue-soft);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fix s{color:var(--bad)} .fix ins{color:var(--good);text-decoration:none;font-weight:700}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px;outline:none}
.composer input:focus{border-color:var(--brand)}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.suggest button{flex:none;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}

/* progress */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.rung{display:flex;flex-direction:column;align-items:center;gap:6px}
.rung .b{width:100%;border-radius:8px 8px 4px 4px;background:var(--surface-2);position:relative;overflow:hidden}
.rung.past .b{background:var(--cue)}
.rung.now .b{background:var(--surface-2);outline:3px solid var(--brand);outline-offset:-3px}
.rung.now .b i{position:absolute;left:0;right:0;bottom:0;background:var(--brand)}

/* ============ ESTADO ============ */
const S={pid:null,tab:'home',media:null,season:null,lesson:null,chat:null,rev:null,sheet:null,filter:'all',q:'',done:{}};
try{const p=localStorage.getItem('deixa.pid');if(p&&PROFILES[p])S.pid=p}catch(e){}
const P=()=>PROFILES[S.pid];
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const media=id=>CATALOG.find(m=>m.id===id);
function epInfo(key){const [mid,s,e]=key.split('-');const m=media(mid);const ep=m.seasons[s].find(x=>x.n==e);return {m,ep,s:+s,e:+e}}
function epLabel(key){const {m,s,e}=epInfo(key);return m.type==='movie'?'Filme':`T${s} · E${e}`}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400)}

/* áudio: no produto real vem do Kokoro; aqui usa a voz do navegador */
function speak(text,slow){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=P().accent==='UK'?'en-GB':'en-US';
    u.rate=(slow?0.6:1)*P().speed;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('Áudio indisponível neste navegador. No app, o áudio vem do Kokoro.')}
}

function fit(m){
  const u=lvIdx(P().level),a=lvIdx(m.lv[0]),b=lvIdx(m.lv[1]);
  if(u<a)return {t:'Desafiador',c:'warn'};
  if(u>b)return {t:'Tranquilo',c:''};
  return {t:'No seu nível',c:'good'};
}

/* ============ RENDER ============ */
function render(){
  if(!S.pid){$app.innerHTML=renderPicker();return}
  if(S.tx){$app.innerHTML=renderTx();return}
  if(S.lesson){$app.innerHTML=renderLesson();return}
  if(S.chat){$app.innerHTML=renderChat();const m=document.querySelector('.msgs');if(m)window.scrollTo(0,document.body.scrollHeight);return}
  let body='';
  if(S.tab==='home')body=renderHome();
  else if(S.tab==='explore')body=S.media?renderDetail():renderExplore();
  else if(S.tab==='review')body=renderReview();
  else if(S.tab==='talk')body=renderTalk();
  else if(S.tab==='progress')body=renderProgress();
  $app.innerHTML=renderTop()+`<main class="main">${body}</main>`+renderNav()+renderSheet();
}

function ring(v,max,color){
  const r=30,c=2*Math.PI*r,p=Math.min(1,v/max);
  return `<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="8"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b>${Math.round(p*100)}%</b></div>`;
}

/* ---------- EXPLORAR ---------- */
function poster(m,cls=''){
  return `<div class="poster ${cls}" style="background:linear-gradient(155deg,${m.c1} 0 58%,${m.c2} 58%);color:${m.fg}"><span class="pm">${m.type==='movie'?'Filme':'Série'} · ${m.year}</span><span class="strip"></span><span class="pt">${esc(m.title)}</span></div>`;
}

  const p=P();
  const conts=Object.entries(PROGRESS[p.id]).filter(([k,v])=>v<100).map(([k,v])=>({k,v,...epInfo(k)}));
  let list=CATALOG.filter(m=>m.title.toLowerCase().includes(S.q.toLowerCase()));
  if(S.filter==='series')list=list.filter(m=>m.type==='series');
  if(S.filter==='movie')list=list.filter(m=>m.type==='movie');
  if(S.filter==='fit')list=list.filter(m=>fit(m).c==='good');

  <div class="chips">${f.map(([k,l])=>`<button class="fchip ${S.filter===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>
  ${conts.length&&!S.q?`<section class="col" style="gap:10px"><div class="sec-h"><h2 style="font-size:18px">Em andamento</h2></div>
    <div class="hscroll">${conts.map(c=>`<button class="cont card" style="padding:10px" data-act="openmedia" data-id="${c.m.id}">${poster(c.m)}<div class="col" style="gap:4px;min-width:0"><b class="small">${esc(c.m.title)}</b><span class="small muted">${epLabel(c.k)} · ${esc(c.ep.t)}</span><div class="bar" style="height:6px"><i style="width:${c.v}%"></i></div></div></button>`).join('')}</div></section>`:''}

function statusChip(ep){
  if(ep.st==='READY')return (ep.audio?`<span class="chip good">Pronto · áudio ${ep.audio}</span>`:`<span class="chip good">Pronto · ${ep.it} frases</span>`)+`<span class="chip mono">${ep.pt?'EN + PT':'só EN'}</span>`+(ep.script?'<span class="chip mono">roteiro</span>':'');
  if(ep.st==='PROCESSING')return `<span class="chip brand">Processando</span>`;
  if(ep.st==='NEEDS_REVIEW')return `<span class="chip warn">Em revisão</span>`;
  return `<span class="chip">Sem legenda</span>`;
}
function renderDetail(){
  const m=media(S.media),p=P(),ft=fit(m);

  ${m.type==='series'?`<div class="seg">${seasons.map(s=>`<button class="${s==S.season?'on':''}" data-act="season" data-s="${s}">Temporada ${s}</button>`).join('')}</div>`:''}
  <section class="card" style="padding:4px 16px">
    ${eps.map(ep=>{const key=`${m.id}-${S.season}-${ep.n}`;const pr=PROGRESS[p.id][key];const ok=ep.st==='READY';

      <button class="playbtn" ${ok?'':'disabled'} data-act="studyep" data-key="${key}" aria-label="Estudar">${pr===100?I.check:I.play}</button></div></div>`}).join('')}
  </section>
  <button class="fab" data-act="sheet" data-s="upload">${I.upload} Enviar legenda de outro episódio</button>`;
}

/* ---------- LIÇÃO ---------- */
function startLesson(n,key){
  const p=P();const set=LESSONS[p.id];
  S.lesson={i:0,ex:set,ok:0,state:'ask',sel:null,built:[],text:'',node:n,replay:n<p.nodeDone,key:key||p.current,t0:Date.now(),wrong:[]};
  render();window.scrollTo(0,0);
}
function exReady(){
  const L=S.lesson,e=L.ex[L.i];
  if(e.k==='intro')return true;
  if(e.k==='order')return L.built.length>0;
  if(e.k==='type'||e.k==='write')return L.text.trim().length>1;
  return L.sel!=null;
}
function renderLesson(){
  const L=S.lesson,p=P();
  if(L.state==='end')return renderEnd();
  const e=L.ex[L.i],pct=L.i/L.ex.length*100;
  let body='';
  const opt=(o,i)=>{let c='';if(L.state!=='ask'){if(i===e.a)c='ok';else if(i===L.sel)c='no'}else if(L.sel===i)c='sel';return `<button class="opt ${c}" data-act="sel" data-i="${i}" ${L.state!=='ask'?'disabled':''}><span class="k">${i+1}</span>${esc(o)}</button>`};
  if(e.k==='intro'){
    body=`<span class="eyebrow">Nova expressão · ${e.type}</span>
    <div class="cuebox"><div class="tcode"><span>${e.tc.split(' --> ')[0]}</span><span>${e.tc.split(' --> ')[1]}</span></div><div class="line">${esc(e.en)}</div></div>
    <div class="intro"><div class="row" style="gap:10px"><button class="speak" data-act="say" data-t="${esc(e.en)}">${I.sound}</button><button class="speak slow" data-act="say" data-t="${esc(e.en)}" data-slow="1">${I.turtle}</button></div>
      <div class="pt">${esc(e.pt)}</div>
      <dl class="kv"><dt>Pronúncia</dt><dd class="${p.level==='C1'?'mono':''}">${esc(e.pron)}</dd><dt>Contexto</dt><dd>${esc(e.ctx)}</dd></dl>
    </div>`;
  }else if(e.k==='choice'){
    body=`<div class="prompt">${e.q}</div>
    ${e.line?`<div class="cuebox"><div class="tcode"><span>${e.tc.split(' --> ')[0]}</span><button data-act="say" data-t="${esc(e.line)}" style="color:#8A90A8;display:flex;gap:4px;align-items:center">${I.sound.replace('<svg','<svg width="16" height="16"')}ouvir</button></div><div class="line">${esc(e.line)}</div></div>`:''}
    ${e.ctx?`<div class="hint"><b>Cena:</b> ${esc(e.ctx)}</div>`:''}
    <div class="opts">${e.opts.map(opt).join('')}</div>`;
  }else if(e.k==='listen'){
    body=`<div class="prompt">${e.q}</div>
    <div class="cuebox"><div class="tcode"><span>legenda oculta</span><span>${p.accent==='UK'?'en-GB':'en-US'}</span></div><div class="row" style="gap:14px"><button class="speak big" data-act="say" data-t="${esc(e.say)}">${I.sound}</button><button class="speak slow" data-act="say" data-t="${esc(e.say)}" data-slow="1">${I.turtle}</button></div></div>
    <div class="opts">${e.opts.map(opt).join('')}</div>`;
  }else if(e.k==='blank'){
    const fill=L.sel!=null?`<b style="color:var(--brand);border-bottom:3px solid var(--brand);padding:0 4px">${e.opts[L.sel]}</b>`:'<span style="display:inline-block;min-width:70px;border-bottom:3px dashed var(--muted)">&nbsp;</span>';
    body=`<div class="prompt">${e.q}</div>
    <div class="cuebox"><div class="line" style="color:#fff">${esc(e.pre)} ${fill}${esc(e.post)}</div></div>
    ${p.level!=='C1'||e.pt?`<div class="hint"><b>PT:</b> ${esc(e.pt)}</div>`:''}
    <div class="opts">${e.opts.map(opt).join('')}</div>`;
  }else if(e.k==='order'){
    const used=new Set(L.built);
    body=`<div class="prompt">${e.q}</div>
    ${e.say?`<div class="row" style="gap:10px"><button class="speak big" data-act="say" data-t="${esc(e.say)}">${I.sound}</button><button class="speak slow" data-act="say" data-t="${esc(e.say)}" data-slow="1">${I.turtle}</button></div>`:`<div class="hint"><b>PT:</b> ${esc(e.pt)}</div>`}
    <div class="answerline">${L.built.map(bi=>`<button class="tok in" data-act="untok" data-i="${bi}" ${L.state!=='ask'?'disabled':''}>${esc(e.bank[bi])}</button>`).join('')}</div>
    <div class="bank">${e.bank.map((w,i)=>`<button class="tok ${used.has(i)?'used':''}" data-act="tok" data-i="${i}" ${used.has(i)||L.state!=='ask'?'disabled':''}>${esc(w)}</button>`).join('')}</div>`;
  }else if(e.k==='type'){
    body=`<div class="prompt">${e.q}</div>
    ${e.say?`<div class="row" style="gap:10px"><button class="speak big" data-act="say" data-t="${esc(e.say)}">${I.sound}</button><button class="speak slow" data-act="say" data-t="${esc(e.say)}" data-slow="1">${I.turtle}</button></div>`:`<div class="cuebox"><div class="line" style="color:#fff">${esc(e.pt)}</div></div>`}
    <textarea class="ta" id="ta" placeholder="Digite em inglês" ${L.state!=='ask'?'disabled':''} autocapitalize="off" spellcheck="false">${esc(L.text)}</textarea>`;
  }else if(e.k==='write'){
    body=`<div class="prompt">${e.q}</div>
    <div class="cuebox"><div class="line" style="color:#fff">${esc(e.src)}</div></div>
    <div class="hint"><b>Dica:</b> o tutor avalia tom, hedging e clareza. Não há uma única resposta certa.</div>
    <textarea class="ta" id="ta" placeholder="Escreva sua versão" ${L.state!=='ask'?'disabled':''}>${esc(L.text)}</textarea>`;
  }
  let foot='';
  if(L.state==='ask'){
    foot=`<div class="lfoot"><button class="btn block" data-act="check" ${exReady()?'':'disabled'}>${e.k==='intro'?'Entendi':'Verificar'}</button></div>`;
  }else{
    const good=L.state==='ok';
    foot=`<div class="lfoot ${good?'ok':'no'}"><div class="fb"><h3>${good?I.check:I.x}${good?L.praise:'Quase!'}</h3>
      ${!good&&L.correct?`<p><b>Resposta:</b> ${esc(L.correct)}</p>`:''}
      ${L.feedback?`<p class="small">${L.feedback}</p>`:''}
      <p class="small muted">${esc(e.why||'')}</p></div>
      <button class="btn block ${good?'good':'bad'}" data-act="next">Continuar</button></div>`;
  }
  return `<div class="lesson">
    <div class="lhead"><button class="iconbtn" data-act="quit" aria-label="Sair">${I.x}</button><div class="bar"><i style="width:${pct}%"></i></div><span class="lvlchip">${p.level}</span></div>
    <div class="lbody">${body}</div>${foot}</div>`;
}
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
function check(){
  const L=S.lesson,e=L.ex[L.i];let ok=false;L.correct='';L.feedback='';
  if(e.k==='intro'){ok=true}
  else if(['choice','listen','blank'].includes(e.k)){ok=L.sel===e.a;L.correct=e.k==='blank'?`${e.pre} ${e.opts[e.a]}${e.post}`:e.opts[e.a]}
  else if(e.k==='order'){const s=L.built.map(i=>e.bank[i]).join(' ');ok=norm(s)===norm(e.ans.join(' '));L.correct=e.ans.join(' ')}
  else if(e.k==='type'){ok=e.accept.includes(norm(L.text));L.correct=e.best;if(!ok&&norm(L.text).split(' ').length>2&&e.accept.some(a=>a.split(' ').slice(0,2).join(' ')===norm(L.text).split(' ').slice(0,2).join(' ')))L.feedback='Começo certo. Compare o final com a resposta.'}
  else if(e.k==='write'){
    const t=L.text.toLowerCase();const hedge=/(might|perhaps|maybe|wonder|not sure|not entirely|could|concern|worth|consider)/.test(t);const words=t.split(/\s+/).filter(Boolean).length;
    ok=hedge&&words>=6;
    L.feedback=ok?`<b>Tutor (simulado):</b> bom tom. Você suavizou com hedging e manteve a crítica clara. Para ir além, proponha um próximo passo: "…could we look at the numbers together?"`:`<b>Tutor (simulado):</b> ainda soa direto. Tente algo como: "I'm not sure this plan gets us where we need to be. Could we look at a couple of alternatives?"`;
  }
  L.state=ok?'ok':'no';if(ok)L.ok++;else L.wrong.push(e);
  L.praise=['Isso aí!','Mandou bem!','Perfeito!','Na mosca!'][Math.floor(Math.random()*4)];
  if(e.k==='intro')L.praise='Adicionada à sua revisão';
  render();
}
function nextEx(){
  const L=S.lesson;L.i++;L.sel=null;L.built=[];L.text='';
  if(L.i>=L.ex.length){
    const p=P(),total=L.ex.length,acc=Math.round(L.ok/total*100);
    let xp=10+L.ok*3+(acc===100?5:0);if(L.replay)xp=Math.round(xp/2);
    L.xp=xp;L.acc=acc;L.secs=Math.max(40,Math.round((Date.now()-L.t0)/1000));
    const before=p.xpToday;p.xpToday+=xp;p.totalXP+=xp;
    if(!L.replay&&L.node===p.nodeDone&&p.nodeDone<TRAILS[p.id].length)p.nodeDone++;
    PROGRESS[p.id][p.current]=Math.min(100,(PROGRESS[p.id][p.current]||0)+(L.replay?0:12));
    L.goalNow=before<p.goal&&p.xpToday>=p.goal;
    if(L.goalNow&&!p.goalMet){p.goalMet=true;p.streak++;p.weekly[6]=p.xpToday}else p.weekly[6]=p.xpToday;
    p.dueCount+=L.wrong.length;

  }else L.state='ask';
  render();window.scrollTo(0,0);
}

/* ---------- LER EPISÓDIO INTEIRO + MARCADOR ---------- */
const toks=s=>s.split(' ');
const clean=t=>t.replace(/^[^\w']+|[^\w']+$/g,'');
function findSeq(l,phrase){const tk=toks(TRANSCRIPT[l].en).map(t=>clean(t).toLowerCase());const ph=phrase.toLowerCase().split(' ');for(let i=0;i<=tk.length-ph.length;i++){if(ph.every((w,j)=>tk[i+j]===w))return ph.map((_,j)=>i+j)}return []}
function openTx(key){
  const p=P(),marks={},lines=new Set();
  if(key===p.current){PREMARKS[p.id].forEach(([l,ph])=>{marks[l]=[...(marks[l]||[]),...findSeq(l,ph)]});PRELINES[p.id].forEach(l=>lines.add(l))}
  const lv=lvIdx(p.level);
  S.tx={key,marks,lines,mode:lv<=1?'both':lv<=3?'tap':'en',reveal:new Set(),audio:new Set([0,1]),audioBusy:null,q:'',stage:'read',scope:'me',cards:[],step:0};
  render();window.scrollTo(0,0);
}
function runs(arr){const a=[...new Set(arr)].sort((x,y)=>x-y);const out=[];a.forEach(i=>{const last=out[out.length-1];if(last&&last[last.length-1]===i-1)last.push(i);else out.push([i])});return out}
function txCount(){const T=S.tx;return Object.values(T.marks).reduce((n,a)=>n+runs(a).length,0)+T.lines.size}
function buildCards(){
  const T=S.tx,cards=[];
  TRANSCRIPT.forEach((L,l)=>{
    if(T.lines.has(l))cards.push({term:L.en,meaning:L.pt,type:'Frase',l,idx:toks(L.en).map((_,i)=>i),whole:true});
    runs(T.marks[l]||[]).forEach(r=>{
      const tk=toks(L.en);const term=r.map(i=>clean(tk[i])).join(' ');const k=term.toLowerCase();
      let meaning=GLOSS[k];
      if(!meaning&&r.length>1){const parts=r.map(i=>GLOSS[clean(tk[i]).toLowerCase()]).filter(Boolean);if(parts.length)meaning=parts.join(' + ')}
      cards.push({term,meaning:meaning||null,type:r.length>1?'Expressão':'Palavra',l,idx:r});
    });
  });
  return cards;
}
function renderTx(){
  const T=S.tx,{m,ep}=epInfo(T.key),hasPT=!!ep.pt;
  if(T.stage==='gen')return renderTxGen(hasPT);
  if(T.stage==='result')return renderTxResult(m,hasPT);
  const n=txCount(),q=T.q.trim().toLowerCase();
  const modes=[['both','EN + PT'],['tap','PT ao tocar'],['en','Só inglês']];
  let lastScene='';
  const lines=TRANSCRIPT.map((L,i)=>{
    if(q&&!L.en.toLowerCase().includes(q)&&!L.pt.toLowerCase().includes(q))return '';
    const mk=new Set(T.marks[i]||[]);
    let sc='';if(L.sc){lastScene=L.sc}if(L.sc||(q&&lastScene)){sc=L.sc?`<div class="scene">${L.sc.toUpperCase()} · ${L.tc}</div>`:''}
    const words=toks(L.en).map((w,wi)=>`<span class="w ${mk.has(wi)?'mk':''} ${q&&w.toLowerCase().includes(q)?'hit':''}" data-act="txw" data-l="${i}" data-w="${wi}" role="button" tabindex="0">${esc(w)}</span>`).join(' ');
    let pt='';
    const ptLine=`<div class="pt"><span class="src">${hasPT?'PT':'IA'}</span>${esc(L.pt)}</div>`;
    if(T.mode==='both')pt=ptLine;
    else if(T.mode==='tap')pt=T.reveal.has(i)?ptLine:`<button class="reveal" data-act="txreveal" data-l="${i}">ver tradução</button>`;
    return `${sc}<div class="tline ${T.lines.has(i)?'mk':''}">
      <div class="tc">${L.tc}<button class="abtn" data-act="txsay" data-l="${i}" aria-label="Ouvir a fala">${T.audioBusy===i?'<span class="spin"></span>gerando…':I.sound.replace('<svg','<svg width="14" height="14"')+(T.audio.has(i)?'':'ouvir')}</button>${L.g?`<span class="chip warn" style="padding:1px 7px;font-size:11px">marcada por ${L.g} alunos</span>`:''}</div>
      <div class="en">${words}</div>
      <button class="mkbtn ${T.lines.has(i)?'on':''}" data-act="txline" data-l="${i}" aria-label="Marcar a fala inteira">${I.marker}</button>
      ${pt}</div>`;
  }).join('');
  return `<div class="tx">
    <div class="txhead">
      <div class="row"><button class="iconbtn" data-act="txclose" aria-label="Voltar">${I.back}</button><div class="col" style="gap:0;flex:1;min-width:0"><b>${esc(m.title)} · ${epLabel(T.key)}</b><span class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ep.t)} · legenda ${hasPT?'EN + PT alinhada':'EN, tradução por IA'}</span></div></div>
      <div class="seg">${modes.map(([k,l])=>`<button class="${T.mode===k?'on':''}" data-act="txmode" data-m="${k}">${l}</button>`).join('')}</div>
      <label class="search" style="padding:8px 12px">${I.search}<input id="txq" placeholder="Procurar uma fala que você ouviu" value="${esc(T.q)}" autocomplete="off"></label>
    </div>
    <div class="txlines">
      <div class="hint" style="margin-top:12px">${I.marker.replace('<svg','<svg width="20" height="20" style="flex:none;color:var(--cue-deep)"')}<span>Toque nas <b>palavras</b> que você não conhece. Palavras vizinhas viram uma expressão. Use o marcador ao lado para salvar a <b>fala inteira</b>.</span></div>
      ${lines||`<p class="muted" style="padding:24px 0">Nenhuma fala com "${esc(T.q)}".</p>`}
      <p class="small muted" style="margin-top:16px">Mostrando um trecho (${TRANSCRIPT.length} falas). No app, o episódio inteiro aparece aqui. O áudio de cada fala só é gerado na primeira vez que alguém toca em "ouvir" e depois fica salvo para todos.</p>
    </div>
    <div class="txfoot"><div class="col" style="gap:2px"><span class="count">${n}</span><span class="small muted">marcações</span></div><span class="spacer"></span><button class="btn" data-act="txgen" ${n?'':'disabled'}>${I.spark.replace('<svg','<svg width="18" height="18"')} Gerar cards</button></div>
  </div>`;
}
function renderTxGen(hasPT){
  const T=S.tx;

const MOCK_SEARCH=[{id:'friends'},{id:'himym'},{id:'office'},{id:'tedlasso'},{id:'bb'},{id:'prada'},{id:'socialnetwork'},

    ${movie?'':`<div class="row"><div class="field" style="flex:1"><label for="ups">Temporada</label><input id="ups" type="number" min="1" value="${U.s}" inputmode="numeric"></div><div class="field" style="flex:1"><label for="upe">Episódio</label><input id="upe" type="number" min="1" value="${U.e}" inputmode="numeric"></div></div>`}
    ${slot('upfile','EN','Legenda em inglês','.srt · obrigatória',U.file,'.srt')}
    ${slot('upfilept','PT','Legenda em português','.srt · opcional · as falas já chegam traduzidas, sem gastar IA',U.filePt,'.srt')}
    ${slot('upscript','TXT','Roteiro ou transcrição','.txt ou .pdf · opcional · ajuda quando a legenda corta falas',U.script,'.txt,.pdf')}
    ${U.script?'':`<label class="check"><input type="checkbox" id="upai" ${U.aiScript?'checked':''}><span>Sem roteiro? <b>Buscar transcrição com IA</b> para preencher falas que faltam. Trechos não confirmados pelo SRT ficam marcados como "não verificado".</span></label>`}
    <button class="link" data-act="upsample" style="align-self:center">Usar arquivos de exemplo (EN + PT)</button>
    ${U.err?`<p class="small" style="color:var(--bad)">${U.err}</p>`:''}

  }

    :[['Validando arquivos',pt?'EN 52 KB · PT 55 KB':'UTF-8 · 52 KB'],['Calculando SHA-256','b7d0…3c9f'],['Verificando duplicidade','nenhuma'],['Lendo o SRT em inglês','412 falas'],
      ...(pt?[['Lendo o SRT em português','409 falas'],['Alinhando EN ↔ PT pelo tempo','398 pares · 97%']]:[]),
      ...(sc?[[U.script?'Lendo o roteiro':'Buscando transcrição com IA',U.script?'conferido com o SRT':'14 falas novas · não verificadas']]:[]),
      ['Agrupando frases','287 frases'],['Selecionando frases úteis (Gemini)','46 itens'],['Gerando explicações',pt?'tradução da legenda PT':'tradução pela IA'],['Publicando no catálogo','READY'],['Áudio das frases da trilha (Kokoro)','46 frases · demais falas sob demanda']];
  U.total=stages.length;
  return `<h2 style="font-size:22px">Processando</h2><p class="small muted mono">${esc(U.file)}</p>
  <div class="col" style="gap:12px">${stages.map(([t,d],i)=>{const st=i<U.stage?'done':i===U.stage?'run':'wait';return `<div class="pstep ${st}"><span class="s">${st==='done'?I.check:''}</span><span>${t}</span><span class="small muted mono">${st==='wait'?'':d}</span></div>`}).join('')}</div>

}
function slot(id,tag,title,sub,file,accept){
  return `<label class="slot ${file?'ok':''}"><span class="ic">${file?I.check.replace('<svg','<svg width="20" height="20"'):tag}</span><span class="col" style="gap:1px;min-width:0"><b class="small">${title}</b><span class="small muted" style="overflow-wrap:anywhere">${file?esc(file):sub}</span></span><span class="link small">${file?'Trocar':'Escolher'}</span><input type="file" id="${id}" accept="${accept}" hidden></label>`;
}
function runPipeline(){
  const U=S.up;U.step=3;U.stage=0;render();const total=U.total;
  const tick=()=>{if(!S.up)return;U.stage++;
    if(!U.dup&&U.stage===total-1){publishUpload()}
    if(U.stage>=total){U.finished=true}
    render();if(U.stage<total)setTimeout(tick,U.stage>=total-5&&U.stage<=total-3?900:450)};
  setTimeout(tick,450);
}
function publishUpload(){
  const U=S.up;let m=media(U.sel);
  if(!m){const r=MOCK_SEARCH.find(x=>x.id===U.sel);m={id:r.id,title:r.title,type:r.type,year:r.year,lv:['B1','B2'],accent:'EUA',c1:r.c1,c2:r.c2,fg:r.fg,syn:'Adicionado agora ao catálogo compartilhado. Sinopse importada do TMDB (simulado).',seasons:{}};CATALOG.unshift(m);UPLOADER[m.id]=P().name}
  const s=m.type==='movie'?0:U.s;m.seasons[s]=m.seasons[s]||[];
  let ep=m.seasons[s].find(x=>x.n==U.e);
  if(!ep){ep={n:U.e,t:m.type==='movie'?'Filme completo':`Episódio ${U.e}`,d:22};m.seasons[s].push(ep);m.seasons[s].sort((a,b)=>a.n-b.n)}
  Object.assign(ep,{st:'READY',it:46,audio:'12/46',pt:!!U.filePt,script:!!U.script||!!U.aiScript});U.media=m.id;U.season=String(s);
}

document.addEventListener('change',ev=>{

  const e=S.lesson.ex[S.lesson.i];
  if(S.lesson.state==='ask'&&e.opts&&/^[1-4]$/.test(ev.key)&&ev.target.tagName!=='TEXTAREA'){S.lesson.sel=+ev.key-1;render()}
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();if(S.lesson.state==='ask'){if(exReady())check()}else nextEx()}
});
window.addEventListener('scroll',()=>{const t=document.getElementById('top');if(t)t.classList.toggle('scrolled',window.scrollY>4)},{passive:true});
render();
</script>
