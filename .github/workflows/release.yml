name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Versão do app igual à tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/check-release-version.mjs "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  installers:
    name: Instalador (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-server.mjs
      - run: pnpm exec tauri build
      - name: Reunir os instaladores e os hashes
        shell: bash
        run: |
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          files=("$bundle"/dmg/*.dmg "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb "$bundle"/msi/*.msi "$bundle"/nsis/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "nenhum instalador foi gerado"
            exit 1
          fi
          mkdir -p dist
          sums="dist/SHA256SUMS-${{ matrix.os }}.txt"
          : > "$sums"
          for file in "${files[@]}"; do
            cp "$file" dist/
            if command -v sha256sum > /dev/null; then
              hash=$(sha256sum "$file" | cut -d " " -f 1)
            else
              hash=$(shasum -a 256 "$file" | cut -d " " -f 1)
            fi
            echo "$hash  $(basename "$file")" >> "$sums"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Anexar ao release em rascunho
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Criar o rascunho e anexar os arquivos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --draft --title "Deixa $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
